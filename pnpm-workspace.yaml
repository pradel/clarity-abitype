packages:
  - docs
  - examples/*
  - packages/*
allowBuilds:
  "@reown/appkit": false
  esbuild: true
  secp256k1: false
blockExoticSubdeps: true
strictDepBuilds: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1
  vite-plus: 1.0.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
