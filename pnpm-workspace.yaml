packages:
  - docs
  - examples/*
  - packages/*
allowBuilds:
  "@reown/appkit": false
  esbuild: true
  secp256k1: false
blockExoticSubdeps: true
strictDepBuilds: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vitest: 4.1.11
  vite-plus: 0.3.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
